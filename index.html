<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Listy — Mi Enfoque Diario</title>
    
    <!-- PWA Manifest dynamically injected via Blob -->
    <meta name="theme-color" content="#15803d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Listy">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                        },
                        amber: {
                            500: '#f59e0b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            touch-action: manipulation;
        }

        /* Animated Strikethrough Effect */
        .strikethrough-anim {
            position: relative;
            display: inline-block;
        }

        .strikethrough-anim::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: currentColor;
            transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(-50%);
        }

        .completed .strikethrough-anim::after {
            width: 100%;
        }

        /* Task entry animation */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-8px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .task-item {
            animation: slideDown 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Pulse animation for active alarm */
        @keyframes alarmPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }

        .alarm-pulsing {
            animation: alarmPulse 0.8s infinite ease-in-out;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-stone-50 dark:bg-stone-950 text-stone-800 dark:text-stone-100 min-h-full flex flex-col justify-between selection:bg-brand-500 selection:text-white transition-colors duration-300">

        <span>Listy — Mi Enfoque Diario</span>
        <button onclick="resetDay()" class="hover:text-red-500 transition">Reiniciar Día</button>

    <!-- Main Application JavaScript -->
    <script>
        // --- Web Audio API Synth ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;
        let isSoundEnabled = true;
        let alarmInterval = null;

        function getAudioContext() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playCompletionChime() {
            if (!isSoundEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                
                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                gain1.gain.setValueAtTime(0.12, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                osc1.connect(gain1);
                gain1.connect(ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.3);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();
                osc2.type = 'sine';
                osc2.frequency.setValueAtTime(659.25, now + 0.06); // E5
                gain2.gain.setValueAtTime(0.15, now + 0.06);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                osc2.connect(gain2);
                gain2.connect(ctx.destination);
                osc2.start(now + 0.06);
                osc2.stop(now + 0.4);
            } catch (e) {
                console.warn("Audio playback issue:", e);
            }
        }

        function triggerAlarmSound() {
            if (!isSoundEnabled) return;
            stopAlarmSound();

            const playBeepBurst = () => {
                try {
                    const ctx = getAudioContext();
                    const now = ctx.currentTime;
                    const freq = 880; // A5
                    
                    for (let i = 0; i < 4; i++) {
                        const startTime = now + (i * 0.18);
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        
                        osc.type = 'square';
                        osc.frequency.setValueAtTime(freq, startTime);
                        gain.gain.setValueAtTime(0.25, startTime);
                        gain.gain.setValueAtTime(0.001, startTime + 0.08);

                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        
                        osc.start(startTime);
                        osc.stop(startTime + 0.09);
                    }
                } catch (e) {
                    console.warn("Alarm error:", e);
                }
            };

            playBeepBurst();
            alarmInterval = setInterval(playBeepBurst, 1200);
            document.getElementById('alarm-banner').classList.remove('hidden');
        }

        function stopAlarmSound() {
            if (alarmInterval) {
                clearInterval(alarmInterval);
                alarmInterval = null;
            }
            document.getElementById('alarm-banner').classList.add('hidden');
        }

        function toggleSound() {
            isSoundEnabled = !isSoundEnabled;
            if (!isSoundEnabled) stopAlarmSound();
            document.getElementById('sound-icon-on').classList.toggle('hidden', !isSoundEnabled);
            document.getElementById('sound-icon-off').classList.toggle('hidden', isSoundEnabled);
            localStorage.setItem('Listy_sound', isSoundEnabled);
        }

        // --- Web Notifications API & Service Worker Integration ---
        function requestNotificationPermission() {
            if (!("Notification" in window)) {
                alert("Este navegador no soporta notificaciones.");
                return;
            }

            Notification.requestPermission().then(permission => {
                updateNotificationBtnUI();
                if (permission === "granted") {
                    sendNativeNotification("¡Notificaciones Activadas!", "Te avisaremos cuando tu temporizador termine.");
                }
            });
        }

        function updateNotificationBtnUI() {
            if (!("Notification" in window)) return;
            const isGranted = Notification.permission === "granted";
            document.getElementById('notif-icon-on').classList.toggle('hidden', !isGranted);
            document.getElementById('notif-icon-off').classList.toggle('hidden', isGranted);
        }

        function sendNativeNotification(title, body) {
            if ("Notification" in window && Notification.permission === "granted") {
                if (navigator.serviceWorker && navigator.serviceWorker.controller) {
                    navigator.serviceWorker.ready.then(registration => {
                        registration.showNotification(title, {
                            body: body,
                            icon: 'https://cdn-icons-png.flaticon.com/512/190/190411.png',
                            vibrate: [200, 100, 200]
                        });
                    });
                } else {
                    new Notification(title, { body: body });
                }
            }
        }

        // --- Register Inline Service Worker & PWA Manifest ---
        function setupPwaSupport() {
            // Inline Service Worker Script Blob
            const swScript = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => self.clients.claim());
                self.addEventListener('fetch', e => {
                    // Cache offline fallback
                    e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
                });
            `;
            const blob = new Blob([swScript], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(blob);

            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register(swUrl).catch(err => console.log('SW setup skipped', err));
            }

            // Inline PWA Manifest Injection
            const manifest = {
                name: "Listy — Mi Enfoque Diario",
                short_name: "Listy",
                start_url: ".",
                display: "standalone",
                background_color: "#1c1917",
                theme_color: "#15803d",
                icons: [{
                    src: "https://cdn-icons-png.flaticon.com/512/190/190411.png",
                    sizes: "512x512",
                    type: "image/png"
                }]
            };
            const manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            const manifestUrl = URL.createObjectURL(manifestBlob);
            const link = document.createElement('link');
            link.rel = 'manifest';
            link.href = manifestUrl;
            document.head.appendChild(link);
        }

        // --- Application State ---
        let tasks = [];
        let activeFilter = 'all';
        let currentPriority = 'normal';
        let isDarkMode = false;

        // --- Real-Time Timestamp Timer Engine ---
        let timerInterval = null;
        let totalConfiguredSeconds = 25 * 60;
        let timerEndTime = null; // System timestamp when countdown expires
        let isTimerRunning = false;
        let remainingSecondsOnPause = 25 * 60;

        // --- Initialize ---
        window.onload = function() {
            setupPwaSupport();
            loadState();
            renderTasks();
            updateNotificationBtnUI();
            updateTimerDisplay(remainingSecondsOnPause);
            lucide.createIcons();

            // Re-sync timer when tab becomes visible again
            document.addEventListener("visibilitychange", handleVisibilityChange);
        };

        // --- Sync Timer On Tab Return ---
        function handleVisibilityChange() {
            if (document.visibilityState === "visible" && isTimerRunning) {
                syncTimerState();
            }
        }

        function syncTimerState() {
            if (!isTimerRunning || !timerEndTime) return;

            const now = Date.now();
            const diffSeconds = Math.round((timerEndTime - now) / 1000);

            if (diffSeconds <= 0) {
                // Timer finished while tab was inactive
                updateTimerDisplay(0);
                pauseTimer();
                remainingSecondsOnPause = 0;
                triggerAlarmSound();
                sendNativeNotification("¡Tiempo Finalizado! ⏰", "Tu bloque de enfoque en Listy ha terminado.");
                confetti({ particleCount: 60, spread: 70, origin: { y: 0.5 } });
            } else {
                updateTimerDisplay(diffSeconds);
            }
        }

        // --- Timer Controls ---
        function setTimerPreset(minutes) {
            setCustomDuration(minutes * 60);
        }

        function setCustomDuration(totalSeconds) {
            pauseTimer();
            stopAlarmSound();
            totalConfiguredSeconds = Math.max(1, totalSeconds);
            remainingSecondsOnPause = totalConfiguredSeconds;
            timerEndTime = null;
            updateTimerDisplay(remainingSecondsOnPause);
            saveTimerState();
        }

        function toggleTimer() {
            if (isTimerRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (isTimerRunning) return;
            stopAlarmSound();
            
            isTimerRunning = true;
            timerEndTime = Date.now() + (remainingSecondsOnPause * 1000);
            
            document.getElementById('pomo-start-btn').innerHTML = `<i data-lucide="pause" class="w-3.5 h-3.5 fill-current"></i> Pausar`;
            lucide.createIcons();

            // High frequency sync tick
            timerInterval = setInterval(() => {
                syncTimerState();
            }, 500);

            saveTimerState();
        }

        function pauseTimer() {
            if (isTimerRunning && timerEndTime) {
                const now = Date.now();
                remainingSecondsOnPause = Math.max(0, Math.round((timerEndTime - now) / 1000));
            }
            isTimerRunning = false;
            clearInterval(timerInterval);
            timerInterval = null;
            
            document.getElementById('pomo-start-btn').innerHTML = `<i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i> Iniciar`;
            lucide.createIcons();
            saveTimerState();
        }

        function resetTimer() {
            pauseTimer();
            stopAlarmSound();
            remainingSecondsOnPause = totalConfiguredSeconds;
            timerEndTime = null;
            updateTimerDisplay(remainingSecondsOnPause);
            saveTimerState();
        }

        function updateTimerDisplay(secondsToShow) {
            const h = Math.floor(secondsToShow / 3600);
            const m = Math.floor((secondsToShow % 3600) / 60);
            const s = secondsToShow % 60;

            let formatted = '';
            if (h > 0) {
                formatted = `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            } else {
                formatted = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            }

            document.getElementById('pomo-big-display').textContent = formatted;
            document.getElementById('pomo-header-display').textContent = formatted;
        }

        function saveTimerState() {
            localStorage.setItem('Listy_timer', JSON.stringify({
                totalConfiguredSeconds,
                remainingSecondsOnPause,
                timerEndTime,
                isTimerRunning
            }));
        }

        // --- Custom Time Modal ---
        function openTimeModal() {
            if (isTimerRunning) pauseTimer();

            const current = remainingSecondsOnPause;
            const h = Math.floor(current / 3600);
            const m = Math.floor((current % 3600) / 60);
            const s = current % 60;

            document.getElementById('modal-hours').value = h;
            document.getElementById('modal-minutes').value = m;
            document.getElementById('modal-seconds').value = s;

            document.getElementById('time-modal').classList.remove('hidden');
        }

        function closeTimeModal() {
            document.getElementById('time-modal').classList.add('hidden');
        }

        function saveCustomTimeModal() {
            const h = parseInt(document.getElementById('modal-hours').value, 10) || 0;
            const m = parseInt(document.getElementById('modal-minutes').value, 10) || 0;
            const s = parseInt(document.getElementById('modal-seconds').value, 10) || 0;

            const total = (h * 3600) + (m * 60) + s;
            if (total > 0) {
                setCustomDuration(total);
            }
            closeTimeModal();
        }

        // --- Storage Handlers ---
        function saveState() {
            localStorage.setItem('Listy_tasks_v1', JSON.stringify(tasks));
            localStorage.setItem('Listy_dark', isDarkMode);
        }

        function loadState() {
            const savedSound = localStorage.getItem('Listy_sound');
            if (savedSound !== null) {
                isSoundEnabled = savedSound === 'true';
                document.getElementById('sound-icon-on').classList.toggle('hidden', !isSoundEnabled);
                document.getElementById('sound-icon-off').classList.toggle('hidden', isSoundEnabled);
            }

            const savedTasks = localStorage.getItem('Listy_tasks_v1');
            if (savedTasks) {
                try { tasks = JSON.parse(savedTasks); } catch(e) { tasks = []; }
            } else {
                tasks = [
                    { id: '1', text: 'Toca el círculo para tachar y marcar como lista', completed: false, priority: 'high', createdAt: Date.now() },
                    { id: '2', text: 'Usa el temporizador de enfoque arriba cuando lo necesites', completed: false, priority: 'normal', createdAt: Date.now() },
                ];
            }

            const savedDark = localStorage.getItem('Listy_dark');
            if (savedDark === 'true' || (!savedDark && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                enableDarkMode(true);
            }

            // Restore persistent active timer state
            const savedTimer = localStorage.getItem('Listy_timer');
            if (savedTimer) {
                try {
                    const parsed = JSON.parse(savedTimer);
                    totalConfiguredSeconds = parsed.totalConfiguredSeconds || 25 * 60;
                    remainingSecondsOnPause = parsed.remainingSecondsOnPause || 25 * 60;
                    timerEndTime = parsed.timerEndTime || null;
                    
                    if (parsed.isTimerRunning && timerEndTime) {
                        const remaining = Math.round((timerEndTime - Date.now()) / 1000);
                        if (remaining > 0) {
                            startTimer();
                        } else {
                            remainingSecondsOnPause = 0;
                            updateTimerDisplay(0);
                        }
                    } else {
                        updateTimerDisplay(remainingSecondsOnPause);
                    }
                } catch(e) {}
            }
        }

        // --- Dark Mode ---
        function toggleDarkMode() { enableDarkMode(!isDarkMode); }
        function enableDarkMode(enable) {
            isDarkMode = enable;
            document.documentElement.classList.toggle('dark', isDarkMode);
            saveState();
        }

        // --- Priority Selection ---
        function togglePrioritySelect() {
            const label = document.getElementById('priority-label');
            const icon = document.getElementById('priority-icon');
            const btn = document.getElementById('priority-btn');

            if (currentPriority === 'normal') {
                currentPriority = 'high';
                label.textContent = 'Alta';
                icon.className = 'w-4 h-4 text-amber-500 fill-amber-500';
                btn.classList.add('border-amber-500/40', 'bg-amber-500/10');
            } else {
                currentPriority = 'normal';
                label.textContent = 'Normal';
                icon.className = 'w-4 h-4 text-stone-400';
                btn.classList.remove('border-amber-500/40', 'bg-amber-500/10');
            }
        }

        // --- Render Tasks ---
        function renderTasks() {
            const tasksListEl = document.getElementById('tasks-list');
            const emptyStateEl = document.getElementById('empty-state');
            tasksListEl.innerHTML = '';

            let filtered = tasks;
            if (activeFilter === 'pending') filtered = tasks.filter(t => !t.completed);
            else if (activeFilter === 'completed') filtered = tasks.filter(t => t.completed);

            if (filtered.length === 0) {
                emptyStateEl.classList.remove('hidden');
                document.getElementById('empty-state-title').textContent = 
                    activeFilter === 'completed' ? "No hay tareas completadas todavía" :
                    activeFilter === 'pending' ? "¡Todo completado! No hay pendientes" : "Tu lista de tareas está vacía";
            } else {
                emptyStateEl.classList.add('hidden');
                filtered.sort((a, b) => {
                    if (a.completed !== b.completed) return a.completed ? 1 : -1;
                    if (a.priority === 'high' && b.priority !== 'high') return -1;
                    if (a.priority !== 'high' && b.priority === 'high') return 1;
                    return b.createdAt - a.createdAt;
                });

                filtered.forEach(task => {
                    tasksListEl.appendChild(createTaskElement(task));
                });
            }

            updateStats();
            lucide.createIcons();
        }

        function createTaskElement(task) {
            const container = document.createElement('div');
            container.className = `task-item group flex items-center justify-between p-3.5 bg-white dark:bg-stone-900 border border-stone-200/80 dark:border-stone-800 rounded-2xl shadow-sm transition-all hover:border-stone-300 dark:hover:border-stone-700 ${
                task.completed ? 'completed opacity-60 bg-stone-50/50 dark:bg-stone-950/40' : ''
            }`;

            container.innerHTML = `
                <div class="flex items-center gap-3 flex-1 min-w-0 pr-2">
                    <button 
                        onclick="toggleTask('${task.id}')" 
                        class="w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all shrink-0 ${
                            task.completed 
                            ? 'border-brand-500 bg-brand-500 text-white' 
                            : 'border-stone-300 dark:border-stone-600 hover:border-brand-500'
                        }"
                    >
                        ${task.completed ? '<i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>' : ''}
                    </button>

                    <div class="flex items-center gap-2 min-w-0 flex-1 cursor-pointer" onclick="toggleTask('${task.id}')">
                        ${task.priority === 'high' && !task.completed ? `
                            <span class="w-1.5 h-1.5 rounded-full bg-amber-500 shrink-0" title="Alta prioridad"></span>
                        ` : ''}
                        <span class="text-sm font-medium text-stone-800 dark:text-stone-200 truncate strikethrough-anim ${
                            task.completed ? 'text-stone-400 dark:text-stone-500' : ''
                        }">
                            ${escapeHtml(task.text)}
                        </span>
                    </div>
                </div>

                <button 
                    onclick="deleteTask('${task.id}')" 
                    class="opacity-100 sm:opacity-0 group-hover:opacity-100 focus:opacity-100 p-1.5 text-stone-400 hover:text-red-500 hover:bg-stone-100 dark:hover:bg-stone-800 rounded-xl transition"
                    title="Eliminar tarea"
                >
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
            `;

            return container;
        }

        function updateStats() {
            const total = tasks.length;
            const completedCount = tasks.filter(t => t.completed).length;
            const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);

            document.getElementById('progress-bar').style.width = `${percent}%`;
            document.getElementById('stats-count').textContent = `${completedCount} de ${total} (${percent}%)`;

            const subtitle = document.getElementById('stats-subtitle');
            if (total === 0) subtitle.textContent = "Agrega tus tareas para comenzar";
            else if (percent === 100) subtitle.textContent = "¡Increíble! Has completado todas las tareas 🎉";
            else subtitle.textContent = `Te quedan ${total - completedCount} tareas pendientes`;
        }

        function addManualTask() {
            const input = document.getElementById('task-input');
            const text = input.value.trim();
            if (!text) return;

            tasks.unshift({
                id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                text: text,
                completed: false,
                priority: currentPriority,
                createdAt: Date.now()
            });

            saveState();
            renderTasks();
            input.value = '';

            if (currentPriority === 'high') togglePrioritySelect();
        }

        function handleInputKeydown(event) {
            if (event.key === 'Enter') addManualTask();
        }

        function toggleTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            task.completed = !task.completed;

            if (task.completed) {
                playCompletionChime();
                const remaining = tasks.filter(t => !t.completed).length;
                confetti({
                    particleCount: remaining === 0 ? 80 : 25,
                    spread: remaining === 0 ? 70 : 45,
                    origin: { y: remaining === 0 ? 0.6 : 0.75 },
                    colors: ['#22c55e', '#16a34a', '#86efac', '#f59e0b']
                });
            }

            saveState();
            renderTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            saveState();
            renderTasks();
        }

        function setFilter(filter) {
            activeFilter = filter;
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.className = 'filter-tab px-3 py-1 rounded-xl text-xs font-medium transition text-stone-500 hover:text-stone-800 dark:hover:text-stone-200';
            });
            const activeBtn = document.getElementById(`filter-${filter}`);
            if (activeBtn) {
                activeBtn.className = 'filter-tab px-3 py-1 rounded-xl text-xs font-semibold transition bg-stone-200 dark:bg-stone-800 text-stone-900 dark:text-stone-100';
            }
            renderTasks();
        }

        function clearCompleted() {
            tasks = tasks.filter(t => !t.completed);
            saveState();
            renderTasks();
        }

        function resetDay() {
            if (confirm("¿Quieres reiniciar el día? Esto eliminará todas las tareas.")) {
                tasks = [];
                saveState();
                renderTasks();
            }
        }

        function togglePomodoroWidget() {
            document.getElementById('pomo-widget').classList.toggle('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }
    </script>
</body>
</html>
